# The Aliquot stack on one machine: docker compose up -d starts Postgres, the worker, the web door and the
# production studio. It reads two files you make once with `docker compose run --rm init`: config/lab.toml
# (what is where) and .env (its secrets). Every port is published on 127.0.0.1 unless .env sets LABH_BIND;
# put the lab's reverse proxy in front of the web door and the studio. LABH_PAYLOAD_KEY (and _2, _3) go to the sealed
# services only, the worker and the web door; the studio reaches core through the door with ALIQUOT_STUDIO_TOKEN.
#
# For development and the checks, docker compose up -d postgres still starts only the database.
# Ollama is the optional local model (--profile ollama); drop it when lab.toml points at the lab's own vLLM box.
x-app: &app
  build: .
  image: aliquot-app:0.5.1
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
  environment: &app-env
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-labh}@postgres:5432/labh
    LABH_PAYLOAD_KEY: ${LABH_PAYLOAD_KEY:-}
    LABH_PAYLOAD_KEY_2: ${LABH_PAYLOAD_KEY_2:-}    # a rotated key, or a class's own key ([store.keys] in lab.toml)
    LABH_PAYLOAD_KEY_3: ${LABH_PAYLOAD_KEY_3:-}
    LABH_CONFIG: /etc/aliquot/lab.toml
  volumes: ["./config:/etc/aliquot:ro"]

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-labh}", POSTGRES_DB: labh }
    volumes: [pg:/var/lib/postgresql/data]
    ports: ["${LABH_BIND:-127.0.0.1}:${LABH_PG_PORT:-5432}:5432"]   # host-run processes and the checks reach it here; LABH_PG_PORT moves it
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "labh"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    command: ["node", "--permission", "--allow-fs-read=*", "--allow-net", "packages/core/bin/worker.ts", "--config", "/etc/aliquot/lab.toml", "--worker-id", "compose-worker"]

  web:
    <<: *app
    command: ["node", "--permission", "--allow-fs-read=*", "--allow-net", "packages/core/bin/web.ts", "--config", "/etc/aliquot/lab.toml", "--host", "0.0.0.0", "--published", "${LABH_BIND:-127.0.0.1}", "--port", "3000"]   # --published: the door refuses an address beyond the machine unless lab.toml has [auth]
    environment:
      <<: *app-env
      ALIQUOT_STUDIO_TOKEN: ${ALIQUOT_STUDIO_TOKEN:-}
      ALIQUOT_SLACK_TOKEN: ${ALIQUOT_SLACK_TOKEN:-}    # the [surfaces.slack] token, so the door knows the Slack door
      ALIQUOT_TEAMS_TOKEN: ${ALIQUOT_TEAMS_TOKEN:-}    # the [surfaces.teams] token, so the door knows the Teams door
      LABH_SESSION_SECRET: ${LABH_SESSION_SECRET:-}    # signs session cookies when lab.toml has [auth]
      LABH_OIDC_CLIENT_SECRET: ${LABH_OIDC_CLIENT_SECRET:-}   # [auth] client_secret_env, when the provider gave the door a secret
    ports: ["${LABH_BIND:-127.0.0.1}:${LABH_WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Its own environment, not the anchor's: the studio holds no payload key (compose-check.sh asserts it). DATABASE_URL
  # is for Payload's own tables, in the studio schema.
  studio:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      web: { condition: service_healthy }
    working_dir: /app/packages/studio
    command: ["node_modules/.bin/next", "start", "-H", "0.0.0.0", "-p", "3001"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-labh}@postgres:5432/labh
      LABH_CONFIG: /etc/aliquot/lab.toml
      LABH_DOOR_URL: http://web:3000
      ALIQUOT_STUDIO_TOKEN: ${ALIQUOT_STUDIO_TOKEN:-}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
    ports: ["${LABH_BIND:-127.0.0.1}:${LABH_STUDIO_PORT:-3001}:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/admin/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60

  # docker compose run --rm init: aliquot init on a machine with only Docker. It writes config/lab.toml and .env
  # here, owned by whoever owns this folder, and never rewrites an existing .env.
  init:
    image: aliquot-app:0.5.1
    build: .
    profiles: [init]
    user: root
    working_dir: /lab
    volumes: ["./:/lab"]
    entrypoint: ["sh", "-c", "mkdir -p config && node --disable-warning=ExperimentalWarning --permission --allow-fs-read=* --allow-net --allow-fs-write=/lab/config/lab.toml --allow-fs-write=/lab/.env /app/packages/core/bin/aliquot.ts init --config /lab/config/lab.toml --env /lab/.env \"$$@\"; code=$$?; chown -R $$(stat -c %u:%g /lab) config .env 2>/dev/null; exit $$code", "init"]

  # docker compose --profile slack up -d: the Slack door (docs/slack.md). It holds the two Slack tokens and the slack
  # surface's token, and no database or payload key; it reaches the web door over HTTP like aliquot ask.
  slack:
    image: aliquot-app:0.5.1
    build: .
    profiles: [slack]
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      ALIQUOT_SURFACE_TOKEN: ${ALIQUOT_SLACK_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    command: ["node", "--disable-warning=ExperimentalWarning", "--permission", "--allow-fs-read=*", "--allow-net", "packages/core/bin/aliquot.ts", "slack", "--door", "http://web:3000", "--links", "${ALIQUOT_LINKS:-http://localhost:3000}"]

  # docker compose --profile teams up -d: the Teams door (docs/teams.md). It holds the Microsoft app's id, secret and
  # tenant and the teams surface's token, and no database or payload key. The Bot Framework posts to it, so the lab's
  # TLS proxy forwards https://<public name>/api/messages to LABH_TEAMS_BIND:LABH_TEAMS_PORT.
  teams:
    image: aliquot-app:0.5.1
    build: .
    profiles: [teams]
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      ALIQUOT_SURFACE_TOKEN: ${ALIQUOT_TEAMS_TOKEN:-}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID:-}
      MICROSOFT_APP_PASSWORD: ${MICROSOFT_APP_PASSWORD:-}
      MICROSOFT_APP_TENANT_ID: ${MICROSOFT_APP_TENANT_ID:-}
    ports: ["${LABH_TEAMS_BIND:-127.0.0.1}:${LABH_TEAMS_PORT:-3978}:3978"]
    command: ["node", "--disable-warning=ExperimentalWarning", "--permission", "--allow-fs-read=*", "--allow-net", "packages/core/bin/aliquot.ts", "teams", "--door", "http://web:3000", "--links", "${ALIQUOT_LINKS:-http://localhost:3000}", "--listen", "0.0.0.0:3978"]

  ollama:
    image: ollama/ollama
    profiles: [ollama]                       # docker compose --profile ollama up -d
    volumes: [models:/root/.ollama]
    ports: ["${LABH_BIND:-127.0.0.1}:11434:11434"]

volumes: { pg: {}, models: {} }
