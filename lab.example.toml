# lab.toml: where this lab says what is where. Copy to lab.toml (gitignored).
# Every outbound destination has a placement, and the placement alone decides
# which data classes may go there. There is no field for a ceiling.

# Your campus's data tiers beside each class: "uw-madison", "umich", "harvard", or a path to your own copy of one.
# presets/<id>.toml is a starting point for your data steward; this file's [classes] keys win over it. This key goes
# at the top of lab.toml, before any table.
# preset = "uw-madison"

[database]
url_env = "DATABASE_URL"           # e.g. postgres://postgres:labh@localhost:5432/labh

[store]
placement = "lab"                  # where Postgres runs; a hosted database cannot hold D3 and refuses at startup
key_env = "LABH_PAYLOAD_KEY"       # 64 hex characters: openssl rand -hex 32
# To rotate the key, or to keep D3 under a key of its own, name each key by id in place of key_env (docs/install.md,
# "Rotate the key"). key_env = "X" is the same as [store.keys] k1 = "X". New payloads go under current, or under the
# key their class names; a stored payload is read with the key whose id it carries.
# current = "k2"
# [store.keys]
# k1 = "LABH_PAYLOAD_KEY"
# k2 = "LABH_PAYLOAD_KEY_2"
# k3 = "LABH_PAYLOAD_KEY_3"
# [store.class_keys]
# D3 = "k3"

[endpoints.local]
base_url = "http://localhost:11434/v1"   # Ollama on the host; use http://host.docker.internal:11434/v1 from inside docker
placement = "lab"                        # lab hardware: up to D3

# [endpoints.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# placement = "zdr"                      # up to D1
# api_key_env = "OPENROUTER_API_KEY"
# Claude has zero-retention endpoints on OpenRouter only through Bedrock and Vertex, so only names those. zdr = true
# also needs the account's ZDR-only privacy setting turned on, or OpenRouter may still route
# a request elsewhere.
# provider = { zdr = true, data_collection = "deny", allow_fallbacks = false, only = ["amazon-bedrock", "google-vertex"] }

# Native providers. protocol is "openai-chat" (the default), "anthropic-messages" or "openai-responses".
# sampling says whether temperature and top_p are sent. openai-chat sends them unless sampling = false.
# The native protocols send them only with sampling = true, because current Claude models (Opus 4.7 and later,
# Sonnet 5 and later, Fable) and OpenAI reasoning models answer either with a 400. Set it only for an older model
# that takes them, such as claude-sonnet-4-6.
# [endpoints.anthropic]
# base_url = "https://api.anthropic.com"
# placement = "approved"                 # an organization contract the institution approved; a personal key is public
# protocol = "anthropic-messages"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [endpoints.openai]
# base_url = "https://api.openai.com/v1"
# placement = "approved"
# protocol = "openai-responses"
# api_key_env = "OPENAI_API_KEY"

# What a university's IT usually buys. auth_header is "bearer", "x-api-key" or "api-key"; without it the key goes as
# x-api-key on anthropic-messages and as Authorization: Bearer on the others. api_key_file (beside lab.toml) is read
# on every request, so a timer outside Aliquot can refresh a short-lived token; use it or api_key_env, not both.
# models lists the exact ids an endpoint serves when it has no model list to ask. Claude Fable 5 and Mythos 5 are
# Covered Models, kept 30 days on every route, so Aliquot refuses any zdr endpoint that lists one.
# [endpoints.bedrock]
# base_url = "https://bedrock-runtime.us-east-1.amazonaws.com/anthropic"
# placement = "approved"                 # stays in the university's AWS account; what its risk assessment approved
# protocol = "anthropic-messages"
# api_key_env = "AWS_BEARER_TOKEN_BEDROCK"
# models = ["us.anthropic.claude-sonnet-5"]

# Campus contracts. baa = true says PHI may go to the endpoint: a business associate agreement covers it, or the
# covered entity runs it. Without it a message carrying PHI (an MRN, a date of birth, a PHI: banner) is refused there
# before any request. region says where the vendor keeps the data. Export-controlled and CUI content goes only to
# an endpoint with region = "us"; an endpoint without region counts as outside the US. Lab hardware needs neither.
# [endpoints.azure]
# base_url = "https://your-resource.openai.azure.com/openai/v1"
# placement = "approved"                 # the lab's tenant; not available to OpenAI, no training
# protocol = "openai-responses"
# api_key_env = "AZURE_OPENAI_API_KEY"
# auth_header = "api-key"
# region = "us"                          # the resource's region is in the US

# Azure OpenAI through a deployment URL, as many campus tenants still expose it. api_version is sent as
# ?api-version= on every request. A deployment has no model list, so models names the id it answers with.
# [endpoints.azure-hipaa]
# base_url = "https://your-resource.openai.azure.com/openai/deployments/gpt-4o"
# placement = "institution"              # the university's own tenant under its Microsoft BAA
# api_version = "2024-10-21"
# api_key_env = "AZURE_OPENAI_API_KEY"
# auth_header = "api-key"
# models = ["gpt-4o-2024-11-20"]
# baa = true
# region = "us"

# [endpoints.foundry]
# base_url = "https://your-resource.services.ai.azure.com/anthropic"
# placement = "approved"                 # Claude inside the lab's Azure tenant, with a HIPAA configuration available
# protocol = "anthropic-messages"
# api_key_env = "AZURE_FOUNDRY_API_KEY"
# region = "us"

# Bedrock's Converse API, signed with AWS Signature Version 4 in Aliquot (no AWS SDK). The keys come from
# aws_access_key_id_env and aws_secret_access_key_env (defaults AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY), and
# aws_session_token_env (default AWS_SESSION_TOKEN) when the credentials are temporary. A us. inference profile stays
# in US regions; a global. one may run anywhere, so an endpoint with region = "us" refuses to list one.
# [endpoints.bedrock-converse]
# base_url = "https://bedrock-runtime.us-east-1.amazonaws.com"
# placement = "institution"              # the university's AWS account under its AWS BAA
# protocol = "bedrock-converse"
# aws_region = "us-east-1"
# models = ["us.anthropic.claude-sonnet-5"]
# baa = true
# region = "us"

# [endpoints.gemini]
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
# placement = "public"                   # the unpaid tier uses what it receives; approved only on a paid tier IT approved
# api_key_env = "GEMINI_API_KEY"

# [endpoints.campus]
# base_url = "https://ai-gateway.your-university.edu/v1"
# placement = "institution"              # campus IT issues the key; use only for the data its approval names
# api_key_env = "CAMPUS_AI_KEY"

[lab]
name = "Mettu Lab"                     # shown at the top of the chat and record pages; leave it out to show the hostname

[surfaces.web]
placement = "lab"
port = 3000                              # no token: members sign in through [auth] below, or the door stays on this machine
# base_url = "https://ask.lab.example.edu"  # what members type; the provider sends them back to its /callback
# bind = "0.0.0.0"                       # beyond loopback only with [auth]; compose sets it from LABH_BIND

# Sign-on for the web door, with any OpenID Connect provider: Entra ID, Okta, Keycloak, CILogon (docs/install.md).
# A member is the studio account with the email the provider vouches for, unless roles_claim maps their group.
# [auth]
# issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
# client_id = "<application id>"
# client_secret_env = "LABH_OIDC_CLIENT_SECRET"
# session_secret_env = "LABH_SESSION_SECRET"   # openssl rand -hex 32; signs the session cookie
# id_claim = "sub"                       # the member id every run records; "eppn" on an InCommon campus
# email_claim = "email"                  # an email the provider verified; see trust_unverified_email in docs/install.md
# idle_timeout_minutes = 30              # an unused session ends (HIPAA automatic logoff)
# claim_role_max_minutes = 60            # with roles_claim: a role from a group lasts this long, then sign in again
# scopes = ["openid", "email", "profile"]  # CILogon: add "org.cilogon.userinfo" for eppn and isMemberOf
# roles_claim = "isMemberOf"             # with [auth.roles]: roles from the provider's groups
# [auth.roles]
# "lab0:members" = "member"
# "lab0:pi" = "pi"

# Every other surface names the env var that holds its bearer token (32 characters or more, openssl rand -hex 32).
# The door shows a surface nothing above its placement's chat ceiling; anything higher gets the record link only.
[surfaces.acp]                           # aliquot ask and aliquot acp with ALIQUOT_SURFACE_TOKEN set to this token
kind = "acp"
placement = "zdr"                        # D1 at most: T3 Code keeps a copy of every thread
token_env = "ALIQUOT_ACP_TOKEN"

# The studio holds no payload key. It sends every read and write of core to the door's /studio routes with this token,
# and the door answers its test threads on this surface. There is one studio, so the table is [surfaces.studio].
[surfaces.studio]
kind = "studio"
placement = "lab"                        # the most a test thread shows its author; the door withholds anything above it
token_env = "ALIQUOT_STUDIO_TOKEN"

# Slack's servers keep a copy of every answer, so a Slack surface may be approved at most, never lab or institution.
# docs/slack.md: the app manifest, the two Slack tokens, and docker compose --profile slack up -d.
# [surfaces.slack]
# kind = "slack"
# placement = "approved"
# token_env = "ALIQUOT_SLACK_TOKEN"

# Microsoft keeps every Teams message in the institution's own tenant, so a Teams surface may be institution at most,
# never lab. Use approved instead when your institution has not approved Teams for D2 data.
# docs/teams.md: the Azure app registration, the tenant admin's steps, and docker compose --profile teams up -d.
# [surfaces.teams]
# kind = "teams"
# placement = "institution"
# token_env = "ALIQUOT_TEAMS_TOKEN"

[hosts]
"api.openalex.org" = "public"            # a tool reaches only the hosts its manifest names; a host unlisted here is public (D0)
"eutils.ncbi.nlm.nih.gov" = "public"     # pubmed_search
"export.arxiv.org" = "public"            # arxiv_search
"www.ebi.ac.uk" = "public"               # europepmc_search, europepmc_fulltext
"api.crossref.org" = "public"            # doi_lookup
"api.unpaywall.org" = "public"           # doi_lookup (asked only when a contact email is set)

# The literature tools send this env var's value as the polite-pool contact (OpenAlex and Crossref mailto, eutils
# email). Unpaywall requires it; without it doi_lookup skips the open-access check.
[research]
contact_email_env = "LABH_CONTACT_EMAIL"

# Datasets run_code may mount read-only at /data/<id>. The class is the dataset's; an agent mounts only those at or
# below its sandbox mountCeiling, and a mount ceiling of D3 needs an IRB protocol.
# [datasets.cohort-2024]
# path = "/srv/lab/data/cohort-2024"      # absolute; the real path, not a symlink
# class = "D2"
# description = "Wave 1 survey export, one row per participant"

# Tables data_query counts and averages over, inside the sandbox. A column the table has and columns does not name is
# restricted and never leaves the container. A group, or the values behind a measure, smaller than min_cell (5 or
# more) refuses the query. aggregate_class is the class the answer enters a run at. An agent lists table ids in tables.
# [tables.visits]
# description = "Visit log, one row per participant"
# csv = "/srv/lab/data/visits.csv"        # or redcap_url = "https://redcap.example.edu/api/" with
#                                         # redcap_token_env = "REDCAP_TOKEN", and the host placed lab or institution in [hosts]
# aggregate_class = "D1"
# min_cell = 5
# [tables.visits.columns]
# participant_id = "restricted"
# cohort = "free"
# dose_mg = "free"

# The run_code container. Build it once (docker build -t aliquot-sandbox sandbox) and pin the digest it reports.
# [sandbox]
# image = "aliquot-sandbox@sha256:<64 hex>"
# cpus = 1
# memory_mb = 1024
# timeout_ms = 60000
# socket = "/var/run/docker.sock"

[policy]
review_confidential = "refuse"           # or "lab-only"
participant_id_patterns = ["\\bP-\\d{5}\\b"]   # anything matching is D3
# Retention: aliquot retention --apply redacts a run's payload bodies purge_payload_after_days after the last run that
# names them, and clears the door's copy of the reply. keep_min_days is the floor the lab's records rules set (for
# example seven years after close-out). Events, chains and tombstones are never deleted, so every record still
# verifies; no body is redacted under the floor, and a purge under it is refused at startup. A class's own table
# overrides the lab-wide keys. A class with no purge is kept, and without this table nothing is redacted.
# [policy.retention]
# keep_min_days = 2555
# purge_payload_after_days = 2555
# [policy.retention.D3]
# keep_min_days = 1095
# purge_payload_after_days = 1095

# Data classes on top of the five built-ins (public, internal, confidential, restricted, review-confidential).
# See README "Data classes" and fixtures/policy/classes.toml for PHI, controlled-access and export-controlled examples.
# [classes.phi]
# model_tier = "none"          # hosted, local or none
# record = "hash"              # what the record keeps of a refused message: text, hash or none
# retention_days = 30
# detectors = ["hipaa-safe-harbor"]
# message = "This message carries a HIPAA identifier. Remove it, or ask the lab's honest broker."

# Data use agreements: data bound to the members an agreement names, until the day it ends. A member it does not
# name, a run with no member, and everyone after expires get nothing of what it covers, and are told which DUA and
# which rule. The class may not be one a hosted model reads. See README "Data bound to named people: DUAs".
# [duas.sleep-release]
# members = ["ana@lab.example"]         # member ids as runs record them ([auth] id_claim under sign-on)
# expires = 2027-06-30                  # the last day it holds
# class = "restricted"
# entries = ["sleep-kb/release/consent-groups.md"]
# knowledge_bases = []
# datasets = []

# An agent published in the studio answers in the channels it names (surface:channel, for example web:lab).
# Until the router arrives, the fixture agent answers in every other channel. Knowledge bases come from fixtures.
[agents]
fixtures = ["fixtures/agent.json"]

[knowledge_bases]
fixtures = ["fixtures/kb.json"]

# Signed checkpoints of the audit stream and every run record, outside the database (docs/for-research-it-and-irb.md,
# Anchors). The worker appends one line every every_minutes, signed with the Ed25519 key in the file LABH_ANCHOR_KEY_FILE
# names, and needs --allow-fs-write for this path. aliquot init --anchor-key writes a key and this table.
# [anchor]
# path = "anchors.log"                 # relative to this file unless absolute; ship it to write-once storage
# every_minutes = 15
# Document sources: where the lab's documents already live (docs/sources.md). `pnpm sources --watch` keeps the
# knowledge base in step: a folder on every change, Drive on its poll. Scope says which members may see what.
# [sources.box-sops]
# kind = "folder"                  # a Box, OneDrive or Google Drive desktop sync folder
# path = "/Users/labadmin/Library/CloudStorage/Box-Box/Lab SOPs"
# kb = "lab-docs"
# class = "D1"
# scope = ["lab"]                  # or ["group:cryo"], ["member:ana"]
#
# [sources.lab-drive]
# kind = "gdrive"                  # scope comes from each file's Drive permissions
# folder_id = "1AbC..."
# token_env = "LAB_DRIVE_TOKEN"
# kb = "lab-docs"
# class = "D1"
#
# Until member sign-on lands: groups by member id, and the emails Drive permissions name.
# [directory.groups]
# cryo = ["ana"]
# [directory.emails]
# "cryo-group@lab.example.edu" = "group:cryo"
